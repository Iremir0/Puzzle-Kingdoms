<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="Segoe UI, Arial, sans-serif">
  <!-- PB-13 mockup: chapter map with a path and stage nodes, plus a tutorial prompt. -->
  <rect width="360" height="640" fill="#2F4A35"/>
  <!-- terrain blobs -->
  <ellipse cx="70" cy="140" rx="90" ry="60" fill="#365640"/>
  <ellipse cx="300" cy="420" rx="100" ry="70" fill="#365640"/>
  <path d="M0,300 q90,-30 180,10 t180,-20 v40 q-90,30 -180,-10 t-180,20 z" fill="#3A6B8C" opacity="0.8"/>
  <!-- castle at top -->
  <g transform="translate(180,92)"><rect x="-30" y="-20" width="60" height="40" fill="#6B5B45"/><rect x="-36" y="-36" width="16" height="56" fill="#7A6850"/><rect x="20" y="-36" width="16" height="56" fill="#7A6850"/><polygon points="-10,-20 0,-40 10,-20" fill="#8C7A5B"/></g>
  <text x="180" y="138" fill="#FFFFFF" font-size="12" text-anchor="middle">Goblin Fort (chapter 2, locked)</text>

  <!-- path -->
  <path d="M90,560 C40,480 170,470 180,410 S300,340 260,280 S110,230 180,180" stroke="#C9B48A" stroke-width="8" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <!-- nodes -->
  <g transform="translate(90,560)"><circle r="26" fill="#3D7BD9" stroke="#fff" stroke-width="3"/><text y="6" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">1</text><text y="44" fill="#F4BE4F" font-size="14" text-anchor="middle">★★★</text></g>
  <g transform="translate(180,410)"><circle r="26" fill="#3D7BD9" stroke="#F4BE4F" stroke-width="4"/><text y="6" fill="#fff" font-size="16" font-weight="bold" text-anchor="middle">2</text><text y="44" fill="#F4BE4F" font-size="14" text-anchor="middle">★☆☆</text></g>
  <g transform="translate(260,280)"><circle r="30" fill="#394159" stroke="#9AA3B5" stroke-width="3"/><text y="6" fill="#9AA3B5" font-size="16" font-weight="bold" text-anchor="middle">3</text><text y="48" fill="#9AA3B5" font-size="11" text-anchor="middle">Boss · locked</text></g>
  <!-- bounce arrow above current -->
  <polygon points="170,362 190,362 180,376" fill="#F4BE4F"/>

  <!-- top bar -->
  <rect x="0" y="0" width="360" height="44" fill="#1E2230" opacity="0.85"/>
  <text x="16" y="28" fill="#F4BE4F" font-size="16" font-weight="bold">Chapter 1</text>
  <text x="344" y="28" fill="#FFFFFF" font-size="14" text-anchor="end">Gold 70  ⚙</text>

  <!-- tutorial bubble -->
  <rect x="200" y="470" width="150" height="70" rx="10" fill="#FFFFFF"/>
  <polygon points="214,470 200,450 232,470" fill="#FFFFFF"/>
  <text x="212" y="494" fill="#1E2230" font-size="12">Archers shoot from</text>
  <text x="212" y="510" fill="#1E2230" font-size="12">afar. Keep yours in</text>
  <text x="212" y="526" fill="#1E2230" font-size="12">the back row!</text>
  <text x="180" y="630" fill="#C9D6C9" font-size="11" text-anchor="middle">Tap a node to open the stage card (badges from PB-3, Play button)</text>
</svg>
