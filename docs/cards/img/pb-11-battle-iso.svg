<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="Segoe UI, Arial, sans-serif">
  <!-- PB-11 mockup: isometric 3D battle, portrait. Two 4x4 armies on a diamond field. -->
  <rect width="360" height="640" fill="#1E2230"/>
  <text x="16" y="32" fill="#FFFFFF" font-size="16" font-weight="bold">1-2 Arrow Rain</text>
  <text x="344" y="32" fill="#9AA3B5" font-size="16" text-anchor="end">0:14</text>

  <!-- field (diamond) -->
  <polygon points="180,70 350,300 180,530 10,300" fill="#4F7A45"/>
  <polygon points="180,70 350,300 180,530 10,300" fill="none" stroke="#3B5E34" stroke-width="2"/>
  <!-- lane lines -->
  <g stroke="#5E8C53" stroke-width="1">
    <line x1="52" y1="243" x2="222" y2="473"/><line x1="95" y1="185" x2="265" y2="415"/><line x1="138" y1="128" x2="308" y2="358"/>
  </g>
  <!-- enemy units (top-right) -->
  <g fill="#8C7A5B">
    <g transform="translate(200,150)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4"/><circle cx="0" cy="-20" r="6"/></g>
    <g transform="translate(232,192)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4"/><circle cx="0" cy="-20" r="6"/></g>
    <g transform="translate(264,234)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4"/><circle cx="0" cy="-20" r="6"/></g>
    <g transform="translate(168,190)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4"/><circle cx="0" cy="-20" r="6"/></g>
    <g transform="translate(222,128)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-5" y="-14" width="10" height="20" rx="4" fill="#A08E6E"/><circle cx="0" cy="-18" r="5" fill="#A08E6E"/></g>
  </g>
  <!-- player units (bottom-left) -->
  <g transform="translate(120,360)"><ellipse cx="0" cy="8" rx="11" ry="4" fill="#000" opacity="0.25"/><rect x="-7" y="-18" width="14" height="24" rx="4" fill="#E85B55"/><circle cx="0" cy="-22" r="6" fill="#E85B55"/><rect x="-10" y="-14" width="5" height="14" fill="#C0C0C8"/></g>
  <g transform="translate(152,318)"><ellipse cx="0" cy="8" rx="13" ry="5" fill="#000" opacity="0.25"/><rect x="-8" y="-22" width="16" height="28" rx="4" fill="#E85B55" stroke="#F4BE4F" stroke-width="2"/><circle cx="0" cy="-26" r="7" fill="#E85B55"/></g>
  <g transform="translate(184,276)"><ellipse cx="0" cy="8" rx="11" ry="4" fill="#000" opacity="0.25"/><rect x="-7" y="-18" width="14" height="24" rx="4" fill="#E85B55"/><circle cx="0" cy="-22" r="6" fill="#E85B55"/></g>
  <g transform="translate(110,420)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4" fill="#A77BE8"/><polygon points="-6,-20 0,-32 6,-20" fill="#A77BE8"/></g>
  <g transform="translate(150,450)"><ellipse cx="0" cy="8" rx="10" ry="4" fill="#000" opacity="0.25"/><rect x="-6" y="-16" width="12" height="22" rx="4" fill="#58C889"/><circle cx="0" cy="-20" r="5" fill="#58C889"/></g>
  <!-- arrow & spell in flight -->
  <line x1="152" y1="440" x2="200" y2="360" stroke="#fff" stroke-width="2"/>
  <circle cx="160" cy="370" r="5" fill="#A77BE8"/><circle cx="160" cy="370" r="9" fill="#A77BE8" opacity="0.3"/>
  <!-- hp bars -->
  <rect x="140" y="282" width="24" height="4" fill="#000" opacity="0.5"/><rect x="140" y="282" width="18" height="4" fill="#58C889"/>
  <rect x="188" y="120" width="24" height="4" fill="#000" opacity="0.5"/><rect x="188" y="120" width="8" height="4" fill="#E85B55"/>
  <text x="206" y="112" fill="#fff" font-size="12" font-weight="bold">-21</text>

  <text x="180" y="560" fill="#9AA3B5" font-size="11" text-anchor="middle">Camera: orthographic, 45° yaw, 30° pitch. Player army bottom-left,</text>
  <text x="180" y="575" fill="#9AA3B5" font-size="11" text-anchor="middle">enemy top-right. Positions come from BattleSimulator every tick.</text>
  <!-- HUD -->
  <rect x="10" y="590" width="166" height="40" rx="6" fill="#F4BE4F"/><text x="93" y="616" fill="#1E2230" font-size="15" font-weight="bold" text-anchor="middle">Rally (1)</text>
  <rect x="184" y="590" width="50" height="40" rx="6" fill="#4A5675"/><text x="209" y="615" fill="#fff" font-size="13" text-anchor="middle">2x</text>
  <rect x="240" y="590" width="50" height="40" rx="6" fill="#4A5675"/><text x="265" y="615" fill="#fff" font-size="13" text-anchor="middle">II</text>
  <rect x="296" y="590" width="54" height="40" rx="6" fill="#4A5675"/><text x="323" y="615" fill="#fff" font-size="13" text-anchor="middle">Skip</text>
</svg>
