<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Segoe UI, Arial, sans-serif">
  <!-- PB-9 mockup: drag & drop, grouped bench, merge animation. -->
  <rect width="720" height="460" fill="#1E2230"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="18" font-weight="bold">PB-9 War Camp interaction</text>

  <!-- Left: drag & drop -->
  <g transform="translate(20,52)">
    <rect width="320" height="390" rx="10" fill="#2A3042"/>
    <text x="16" y="24" fill="#F4BE4F" font-size="13">A. Drag a unit from the bench onto a cell</text>
    <g transform="translate(52,44)" fill="#394159">
      <rect x="0" y="0" width="50" height="50" rx="4"/><rect x="54" y="0" width="50" height="50" rx="4"/><rect x="108" y="0" width="50" height="50" rx="4"/><rect x="162" y="0" width="50" height="50" rx="4"/>
      <rect x="0" y="54" width="50" height="50" rx="4"/><rect x="54" y="54" width="50" height="50" rx="4" fill="#3D7BD9" stroke="#fff" stroke-width="2" stroke-dasharray="4"/><rect x="108" y="54" width="50" height="50" rx="4"/><rect x="162" y="54" width="50" height="50" rx="4"/>
      <rect x="0" y="108" width="50" height="50" rx="4"/><rect x="54" y="108" width="50" height="50" rx="4"/><rect x="108" y="108" width="50" height="50" rx="4" fill="#E85B55" opacity="0.5"/><rect x="162" y="108" width="50" height="50" rx="4"/>
      <rect x="0" y="162" width="50" height="50" rx="4"/><rect x="54" y="162" width="50" height="50" rx="4"/><rect x="108" y="162" width="50" height="50" rx="4"/><rect x="162" y="162" width="50" height="50" rx="4"/>
    </g>
    <!-- dragged ghost -->
    <rect x="118" y="112" width="46" height="46" rx="6" fill="#A77BE8" opacity="0.9" transform="rotate(-6 141 135)"/>
    <text x="141" y="140" fill="#fff" font-size="11" text-anchor="middle">Mage</text>
    <path d="M46,334 C40,260 120,220 138,162" stroke="#fff" stroke-width="2" fill="none" stroke-dasharray="5 4"/>
    <circle cx="46" cy="334" r="6" fill="#fff" opacity="0.6"/>
    <text x="150" y="282" fill="#9AA3B5" font-size="11">blue = empty, drop here</text>
    <text x="150" y="298" fill="#9AA3B5" font-size="11">red = taken, drop swaps</text>
    <!-- bench row -->
    <rect x="16" y="314" width="288" height="60" rx="6" fill="#394159"/>
    <rect x="26" y="322" width="40" height="40" rx="4" fill="#A77BE8" opacity="0.35"/>
    <rect x="72" y="322" width="40" height="40" rx="4" fill="#58C889"/>
    <rect x="118" y="322" width="40" height="40" rx="4" fill="#58C889"/>
    <text x="232" y="346" fill="#9AA3B5" font-size="11" text-anchor="middle">drop on bench = undeploy</text>
  </g>

  <!-- Right top: grouped bench -->
  <g transform="translate(360,52)">
    <rect width="340" height="190" rx="10" fill="#2A3042"/>
    <text x="16" y="24" fill="#F4BE4F" font-size="13">B. Bench grouped by class and tier, scrolls sideways</text>
    <g font-size="11" fill="#fff">
      <rect x="16" y="40" width="96" height="62" rx="6" fill="#E85B55" stroke="#F4BE4F" stroke-width="3"/>
      <text x="64" y="64" text-anchor="middle">Warrior T1</text><text x="64" y="86" text-anchor="middle" font-size="18" font-weight="bold">×4</text>
      <rect x="120" y="40" width="96" height="62" rx="6" fill="#58C889"/>
      <text x="168" y="64" text-anchor="middle">Archer T1</text><text x="168" y="86" text-anchor="middle" font-size="18" font-weight="bold">×2</text>
      <rect x="224" y="40" width="96" height="62" rx="6" fill="#A77BE8"/>
      <text x="272" y="64" text-anchor="middle">Mage T2</text><text x="272" y="86" text-anchor="middle" font-size="18" font-weight="bold">×1</text>
    </g>
    <rect x="16" y="114" width="304" height="6" rx="3" fill="#394159"/><rect x="16" y="114" width="150" height="6" rx="3" fill="#9AA3B5"/>
    <text x="16" y="144" fill="#9AA3B5" font-size="11">One tile per kind instead of one per unit; the number is the count.</text>
    <text x="16" y="160" fill="#9AA3B5" font-size="11">Gold edge = 3 or more, can merge. Drag the tile = drag one unit.</text>
    <text x="16" y="176" fill="#9AA3B5" font-size="11">Order: Warrior, Archer, Mage, then tier high to low.</text>
  </g>

  <!-- Right bottom: merge animation -->
  <g transform="translate(360,252)">
    <rect width="340" height="190" rx="10" fill="#2A3042"/>
    <text x="16" y="24" fill="#F4BE4F" font-size="13">C. Merge animation (0.5 s) and Undo</text>
    <rect x="20" y="50" width="40" height="40" rx="4" fill="#E85B55"/>
    <rect x="20" y="96" width="40" height="40" rx="4" fill="#E85B55"/>
    <rect x="66" y="74" width="40" height="40" rx="4" fill="#E85B55"/>
    <path d="M110,94 h40" stroke="#fff" stroke-width="2"/><path d="M150,94 l-8,-5 v10 z" fill="#fff"/>
    <circle cx="190" cy="94" r="22" fill="#F4BE4F" opacity="0.3"/>
    <path d="M196,94 h30" stroke="#fff" stroke-width="2"/><path d="M226,94 l-8,-5 v10 z" fill="#fff"/>
    <rect x="240" y="66" width="56" height="56" rx="6" fill="#E85B55" stroke="#F4BE4F" stroke-width="3"/>
    <text x="268" y="100" fill="#fff" font-size="14" text-anchor="middle" font-weight="bold">T2</text>
    <text x="16" y="152" fill="#9AA3B5" font-size="11">3 copies fly to the target, flash, the T2 pops out bigger.</text>
    <rect x="16" y="160" width="74" height="22" rx="4" fill="#4A5675"/><text x="53" y="175" fill="#fff" font-size="11" text-anchor="middle">Undo</text>
    <text x="98" y="175" fill="#9AA3B5" font-size="11">reverts the last merge, until Fight!</text>
  </g>
</svg>
