<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="360" height="640" font-family="Segoe UI, Arial, sans-serif">
  <!-- PB-3 mockup: stage select with difficulty badges. Colours from Palette.cs. -->
  <rect width="360" height="640" fill="#1E2230"/>
  <text x="180" y="62" fill="#F4BE4F" font-size="30" font-weight="bold" text-anchor="middle">Puzzle Kingdoms</text>
  <text x="180" y="88" fill="#9AA3B5" font-size="13" text-anchor="middle">Chapter 1</text>
  <text x="180" y="122" fill="#FFFFFF" font-size="17" text-anchor="middle">Gold: 70</text>

  <!-- Stage 1-1 -->
  <rect x="24" y="150" width="312" height="92" rx="10" fill="#3D7BD9"/>
  <text x="40" y="178" fill="#FFFFFF" font-size="17" font-weight="bold">1. Border Watch</text>
  <text x="320" y="178" fill="#F4BE4F" font-size="17" text-anchor="end">★★★</text>
  <rect x="40" y="194" width="96" height="30" rx="15" fill="#2A3042"/>
  <text x="88" y="214" fill="#9AA3B5" font-size="12" text-anchor="middle">No stones</text>
  <rect x="144" y="194" width="92" height="30" rx="15" fill="#2A3042"/>
  <text x="190" y="214" fill="#9AA3B5" font-size="12" text-anchor="middle">Enemy ×1.0</text>
  <text x="320" y="214" fill="#FFFFFF" font-size="12" text-anchor="end">6 enemies</text>

  <!-- Stage 1-2 -->
  <rect x="24" y="256" width="312" height="92" rx="10" fill="#3D7BD9"/>
  <text x="40" y="284" fill="#FFFFFF" font-size="17" font-weight="bold">2. Arrow Rain</text>
  <text x="320" y="284" fill="#F4BE4F" font-size="17" text-anchor="end">★☆☆</text>
  <rect x="40" y="300" width="96" height="30" rx="15" fill="#2A3042"/>
  <!-- half-stone gem icon -->
  <rect x="50" y="307" width="16" height="16" rx="3" fill="#E85B55"/>
  <path d="M58,307 h6 a2,2 0 0 1 2,2 v12 a2,2 0 0 1 -2,2 h-6 l2,-4 l-2,-4 l2,-4 z" fill="#ADADB8"/>
  <text x="98" y="320" fill="#FFFFFF" font-size="12" text-anchor="middle">3 stones</text>
  <rect x="144" y="300" width="92" height="30" rx="15" fill="#2A3042"/>
  <text x="190" y="320" fill="#F4BE4F" font-size="12" text-anchor="middle">Enemy ×1.1</text>
  <text x="320" y="320" fill="#FFFFFF" font-size="12" text-anchor="end">8 enemies</text>

  <!-- Stage 1-3 locked -->
  <rect x="24" y="362" width="312" height="92" rx="10" fill="#2A3042"/>
  <text x="40" y="390" fill="#9AA3B5" font-size="17" font-weight="bold">3. The Chief's Guard</text>
  <text x="320" y="390" fill="#9AA3B5" font-size="14" text-anchor="end">locked</text>
  <rect x="40" y="406" width="96" height="30" rx="15" fill="#394159"/>
  <rect x="50" y="413" width="16" height="16" rx="3" fill="#E85B55" opacity="0.6"/>
  <path d="M58,413 h6 a2,2 0 0 1 2,2 v12 a2,2 0 0 1 -2,2 h-6 l2,-4 l-2,-4 l2,-4 z" fill="#ADADB8" opacity="0.6"/>
  <text x="98" y="426" fill="#9AA3B5" font-size="12" text-anchor="middle">5 stones</text>
  <rect x="144" y="406" width="92" height="30" rx="15" fill="#394159"/>
  <text x="190" y="426" fill="#E85B55" font-size="12" text-anchor="middle">Enemy ×1.2</text>
  <text x="320" y="426" fill="#9AA3B5" font-size="12" text-anchor="end">Boss</text>

  <!-- Legend -->
  <text x="24" y="500" fill="#9AA3B5" font-size="12">Badge colour: grey ×1.0 · gold ≤ ×1.15 · red above</text>
  <text x="24" y="518" fill="#9AA3B5" font-size="12">Same badges in the Puzzle and War Camp enemy panel.</text>
  <text x="180" y="610" fill="#9AA3B5" font-size="11" text-anchor="middle">PB-3 mockup · not to scale (real screen 1080×1920)</text>
</svg>
