<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" font-family="Segoe UI, Arial, sans-serif">
  <!-- PB-7 storyboard: the five animations, with target durations. -->
  <rect width="720" height="420" fill="#1E2230"/>
  <text x="20" y="32" fill="#FFFFFF" font-size="18" font-weight="bold">PB-7 Puzzle feel: what each animation looks like</text>

  <!-- 1 drag follow -->
  <g transform="translate(20,56)">
    <rect width="128" height="160" rx="8" fill="#2A3042"/>
    <text x="64" y="20" fill="#F4BE4F" font-size="12" text-anchor="middle">1. Drag-follow</text>
    <rect x="20" y="60" width="36" height="36" rx="4" fill="#E85B55" opacity="0.35"/>
    <rect x="40" y="60" width="36" height="36" rx="4" fill="#E85B55"/>
    <rect x="76" y="60" width="36" height="36" rx="4" fill="#58C889"/>
    <line x1="38" y1="110" x2="68" y2="110" stroke="#fff" stroke-width="2" marker-end="url(#a)"/>
    <text x="64" y="132" fill="#9AA3B5" font-size="10" text-anchor="middle">gem follows the finger,</text>
    <text x="64" y="146" fill="#9AA3B5" font-size="10" text-anchor="middle">max half a cell</text>
  </g>
  <!-- 2 swap -->
  <g transform="translate(160,56)">
    <rect width="128" height="160" rx="8" fill="#2A3042"/>
    <text x="64" y="20" fill="#F4BE4F" font-size="12" text-anchor="middle">2. Swap 0.15 s</text>
    <rect x="22" y="60" width="36" height="36" rx="4" fill="#58C889"/>
    <rect x="70" y="60" width="36" height="36" rx="4" fill="#E85B55"/>
    <path d="M40,56 q24,-18 48,0" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M88,100 q-24,18 -48,0" stroke="#fff" stroke-width="2" fill="none"/>
    <text x="64" y="140" fill="#9AA3B5" font-size="10" text-anchor="middle">both slide, ease-out</text>
  </g>
  <!-- 3 invalid bounce -->
  <g transform="translate(300,56)">
    <rect width="128" height="160" rx="8" fill="#2A3042"/>
    <text x="64" y="20" fill="#F4BE4F" font-size="12" text-anchor="middle">3. Invalid 0.25 s</text>
    <rect x="22" y="60" width="36" height="36" rx="4" fill="#E85B55"/>
    <rect x="70" y="60" width="36" height="36" rx="4" fill="#A77BE8"/>
    <path d="M40,110 l14,0 l-6,-5 m6,5 l-6,5" stroke="#fff" stroke-width="2" fill="none"/>
    <path d="M88,110 l-14,0 l6,-5 m-6,5 l6,5" stroke="#E85B55" stroke-width="2" fill="none"/>
    <text x="64" y="134" fill="#9AA3B5" font-size="10" text-anchor="middle">go 40%, come back,</text>
    <text x="64" y="148" fill="#9AA3B5" font-size="10" text-anchor="middle">small shake, no move used</text>
  </g>
  <!-- 4 clear -->
  <g transform="translate(440,56)">
    <rect width="128" height="160" rx="8" fill="#2A3042"/>
    <text x="64" y="20" fill="#F4BE4F" font-size="12" text-anchor="middle">4. Clear 0.2 s</text>
    <rect x="16" y="60" width="30" height="30" rx="4" fill="#58C889"/>
    <rect x="52" y="63" width="24" height="24" rx="4" fill="#58C889" opacity="0.6"/>
    <rect x="86" y="68" width="14" height="14" rx="3" fill="#58C889" opacity="0.3"/>
    <text x="64" y="120" fill="#9AA3B5" font-size="10" text-anchor="middle">pop up 110%, then</text>
    <text x="64" y="134" fill="#9AA3B5" font-size="10" text-anchor="middle">shrink to 0 + fade;</text>
    <text x="64" y="148" fill="#9AA3B5" font-size="10" text-anchor="middle">"+1" flies to the meter</text>
  </g>
  <!-- 5 fall / spawn -->
  <g transform="translate(580,56)">
    <rect width="120" height="160" rx="8" fill="#2A3042"/>
    <text x="60" y="20" fill="#F4BE4F" font-size="12" text-anchor="middle">5. Fall + spawn</text>
    <rect x="42" y="34" width="36" height="36" rx="4" fill="#F4BE4F" opacity="0.5" stroke-dasharray="3" stroke="#fff"/>
    <rect x="42" y="80" width="36" height="36" rx="4" fill="#A77BE8"/>
    <line x1="60" y1="72" x2="60" y2="78" stroke="#fff" stroke-width="2"/>
    <text x="60" y="134" fill="#9AA3B5" font-size="10" text-anchor="middle">fall 0.06 s per cell,</text>
    <text x="60" y="148" fill="#9AA3B5" font-size="10" text-anchor="middle">tiny bounce on landing</text>
  </g>

  <!-- timeline -->
  <text x="20" y="252" fill="#FFFFFF" font-size="14" font-weight="bold">One move, frame by frame (MoveReplay.Frames)</text>
  <g transform="translate(20,266)" font-size="11">
    <rect x="0" y="0" width="90" height="34" rx="4" fill="#3D7BD9"/><text x="45" y="21" fill="#fff" text-anchor="middle">Swapped</text>
    <rect x="96" y="0" width="90" height="34" rx="4" fill="#E85B55"/><text x="141" y="21" fill="#fff" text-anchor="middle">Cleared #0</text>
    <rect x="192" y="0" width="90" height="34" rx="4" fill="#58C889"/><text x="237" y="21" fill="#fff" text-anchor="middle">Filled #0</text>
    <rect x="288" y="0" width="90" height="34" rx="4" fill="#E85B55"/><text x="333" y="21" fill="#fff" text-anchor="middle">Cleared #1</text>
    <rect x="384" y="0" width="90" height="34" rx="4" fill="#58C889"/><text x="429" y="21" fill="#fff" text-anchor="middle">Filled #1</text>
    <rect x="480" y="0" width="90" height="34" rx="4" fill="#A77BE8"/><text x="525" y="21" fill="#fff" text-anchor="middle">Reshuffled?</text>
    <text x="0" y="56" fill="#9AA3B5">Each coloured box is one Frame. Today the board just jumps from one frame to the next;</text>
    <text x="0" y="72" fill="#9AA3B5">PB-7 tweens between them. The logic does not change: tween from Frame N to Frame N+1</text>
    <text x="0" y="88" fill="#9AA3B5">using Step.Cleared, Step.Falls and Step.Spawns. Whole move should feel under ~1.2 s.</text>
    <text x="0" y="112" fill="#F4BE4F">Rule: input stays blocked while IsBusy is true; tapping during a cascade does nothing.</text>
  </g>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fff"/></marker></defs>
</svg>
